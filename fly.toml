app = "hmb-global-bot"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  FLASK_DEBUG = "0"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  DB_PATH = "/app/data/hmb_global.sqlite3"

[[files]]
  guest_path = "/app/cookies.txt"
  secret_name = "YOUTUBE_COOKIE_FILE"

[[mounts]]
  source = "hmb_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
