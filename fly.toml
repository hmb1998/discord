app = "your-discord-music-bot"

[build]
  dockerfile = "Dockerfile"

# ⚠️ NOTE: Do NOT put DISCORD_BOT_TOKEN here!
# Use: fly secrets set DISCORD_BOT_TOKEN=your_token

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 8080
    handlers = ["http"]
